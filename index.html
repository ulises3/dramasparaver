<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Sitio Web</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #ff5722;
        }
        .video-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
            aspect-ratio: 16 / 9;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <h1>Bienvenidos a mi Sitio Web</h1>
    <p>Aquí puedes colocar la descripción de tus videos, películas o series.</p>

        <iframe src="AQUI_PEGAS_EL_ENLACE_DE_TU_EMBED" allowfullscreen></iframe>
    </div>

</body>
</html>
