<!DOCTYPE html>
<html lang="es">

<div class="ad-container ad-top" id="slot-banner"></div>

<script>
    fetch('banner-ad.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('slot-banner').innerHTML = data;
            // Forzamos la ejecución de los scripts de Adsterra insertados
            var scripts = document.getElementById('slot-banner').getElementsByTagName('script');
            for (var i = 0; i < scripts.length; i++) {
                eval(scripts[i].innerHTML);
            }
        });
</script>
