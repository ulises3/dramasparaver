        body { font-family: Arial, sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 0; }

        /* Grilla completa de catálogo */
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .card { background: #1a1a1a; border-radius: 8px; overflow: hidden; border: 1px solid #2a2a2a; transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; height: 160px; object-fit: cover; background-color: #333; }
        .card-content { padding: 15px; }
        .card-content h3 { font-size: 16px; margin: 0 0 10px 0; color: #fff; }
        .card-content p { font-size: 13px; color: #aaa; margin: 0 0 15px 0; }
        .card-link { color: #ff5722; text-decoration: none; font-size: 14px; font-weight: bold; }

        @media (max-width: 768px) {
            .grid-3 { grid-template-columns: 1fr; }
        }
        footer { text-align: center; padding: 20px; color: #777; font-size: 14px; border-top: 1px solid #222; margin-top: 40px; }
    </style>
</head>

<style>

    .nav-container { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; height: 60px; }
    .logo { font-size: 20px; color: #ff5722; font-weight: bold; }
    .nav-links { display: flex; align-items: center; }
    .nav-links a { color: #ffffff; text-decoration: none; margin-left: 20px; font-weight: bold; font-size: 15px; }
    .nav-links a:hover { color: #ff5722; }
    
    /* Botón hamburguesa oculto por defecto en PC */
    .menu-toggle { display: none; font-size: 26px; color: #ffffff; cursor: pointer; }

    /* Adaptación para móviles (pantallas menores a 768px) */
    @media (max-width: 768px) {
        .menu-toggle { display: block; }
        .nav-links {
            display: none; /* Oculto por defecto en móvil */
            flex-direction: column;
            width: 100%;
            background-color: #1f1f1f;
            position: absolute;
            top: 60px;
            left: 0;
            padding: 15px 0;
            border-bottom: 2px solid #ff5722;
            text-align: center;
        }
        .nav-links.active {
            display: flex; /* Se muestra al hacer clic */
        }
        .nav-links a {
            margin: 10px 0;
            font-size: 16px;
        }
        .nav-container {
            position: relative;
        }
    }
</style>

<script>
    /* Script para abrir y cerrar el menú hamburguesa en móvil */
    function toggleMenu() {
        var links = document.getElementById("navLinks");
        links.classList.toggle("active");

</script>
